<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        body { 
            font-family: Arial, Helvetica, sans-serif;

            
        }

        div {
            margin: 10px;
        }
    </style>
</head>
<body>
    <h1>Teste Formulario</h1>

    <form action="cadastro.php">
        <div>
            <label for="inome">Nome:</label>
            <input type="text" name="nome" id="inome" placeholder="Nome Completo" required>
        </div>
        <div>
            <label for="imedia">Média</label>
            <input type="number" name="media" id="imedia"required placeholder="0 a 10" step="0.5" min="0" max="10">
        </div>
        
        <div>
            <label for="imes">Período Letivo</label>
            <input type="month" name="mes" id="imes" value="2025-06">
        </div>
        <div>
            <label for="idia">Dia da Prova</label>
            <input type="date" name="dia" id="idia" value="2025-06-03">
        </div>
        <div>
            <label for="hora">Hora da Prova</label>
            <input type="time" name="hora" id="ihora" value="09:00">
        </div>

        <div>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </div>
    </form>

</body>
</html>
