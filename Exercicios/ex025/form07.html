<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulário</title>

    <style>
        div {
            padding-bottom: 10px;
        }
    
    </style>
</head>

<body>
    <h1>Exemplo de formulário</h1>
    <form action="cadastro.php" method="post">

        <div>
            <label for="iest" >Estado</label>
            <select name="estado" id="iest">

                <optgroup label="Região Sudeste">
                    <option value="SP" selected>São Paulo</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="RJ">Rio de Janeiro</option>
        
                </optgroup>

                <optgroup label="Região Nordeste">
                    <option value="MA">Maranhão</option>
                    <option value="PE">Pernambuco</option>
                    <option value="RN">Rio Grande do Norte</option>
                </optgroup>
                </select>

                <div class="espaco">
                    <label for="iprof" class="espaco">Profissão</label><br>
                    <input type="text" name="prof" id="iprof" list="lstprof">
                    <datalist id="lstprof">
                        <option>Arrumador</option>
                        <option>Pintor</option>
                        <option>Engenheiro</option>
                        <option>Contador</option>
                        <option>Desenvolvedor</option>


                    </datalist>

                </div>

                <div>
                    <label for="imsg" class="espaco">Mensagem</label><br>
                    <textarea name="msg" id="imsg" cols="30" rows="10" placeholder="Digite sua Mensagem"></textarea>
                </div>
            

        </div>

        <div>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </div>

    </form>

</body>

</html>
