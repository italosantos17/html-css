<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
            background-color: rgba(0, 255, 255, 0.295);
            display: flex;
            flex-flow: row nowrap;
        }

        div.item {
            background-color: rgba(12, 127, 228, 0.199);
            border: 1px solid black;
            text-align: center;
            box-shadow:1px 1px rgba(0, 0, 0, 0.419);
            flex-basis: 200px;
            
        }

        div#cxa {
            /*2° flex-shrink:1;
           1° flex-grow:0;
           3° flex-basis: 200px; */
            flex: 0 1 200px;

        }

        div#cxb {
             /* flex-shrink: 1;
            flex-grow: 1;
            flex-basis: 200px;*/
            flex: 1 1 200px;
            
        }

        div#cxc {
             /* flex-shrink: 8;
            flex-grow: 1;
            flex-basis: 200px;*/

            flex: 1 8 200px;
            
        }
    </style>
</head>
<body>
    <div class="conteiner">
        
        <div class="item" id="cxa">A</div>
        <div class="item" id="cxb">B</div>
        <div class="item" id="cxc">C</div>
        
    </div>
    
</body>
</html>
